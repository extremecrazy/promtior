<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Mis Reservas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            color-scheme: light;
            --background: #f5f4f4;
            --sidebar-bg: #171717;
            --sidebar-text: #b8b6b3;
            --sidebar-active: #ffffff;
            --sidebar-accent: #c4b8e0;
            --card-bg: #ffffff;
            --text: #171717;
            --text-muted: #82797d;
            --border: #e5e3e2;
            --accent: #171717;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            font-family: 'Geist', "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
            background: var(--background);
        }

        .sidebar {
            width: 220px;
            flex-shrink: 0;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .sidebar-brand {
            padding: 0 20px 20px;
            display: flex;
            align-items: center;
        }

        .sidebar-logo {
            width: 120px;
            height: auto;
            display: block;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            color: var(--sidebar-text);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            border-left: 3px solid transparent;
        }

        .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .sidebar-nav a.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--sidebar-active);
            border-left-color: var(--sidebar-accent);
        }

        .sidebar-nav .icon {
            font-size: 1.05rem;
        }

        .sidebar-footer {
            padding: 16px 20px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-footer .username {
            font-weight: 600;
            color: #fff;
            font-size: 0.9rem;
        }

        .sidebar-footer form {
            margin: 0;
        }

        .sidebar-footer button {
            width: 100%;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            background: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .sidebar-footer button:hover {
            background: var(--background);
        }

        main {
            flex: 1;
            padding: 32px;
            display: flex;
            justify-content: center;
        }

        .bookings-card {
            width: 100%;
            max-width: 860px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(23, 23, 23, 0.08);
            padding: 32px;
        }

        .bookings-card h1 {
            margin: 0 0 20px;
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 600;
            color: var(--text);
            font-size: 1.4rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.03em;
        }

        td {
            color: var(--text);
        }

        .status {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .status.active {
            background: #ecfdf5;
            color: #047857;
        }

        .status.other {
            background: #f3f4f6;
            color: var(--text-muted);
        }

        .empty-state {
            color: var(--text-muted);
            text-align: center;
            padding: 40px 0;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar(active='my-bookings', username=${username}, isAdmin=${isAdmin})}"></div>
<main>
    <div class="bookings-card">
        <h1>Mis Reservas</h1>
        <p class="empty-state" th:if="${#lists.isEmpty(bookings)}">Todavía no tenés reservas.</p>
        <table th:unless="${#lists.isEmpty(bookings)}">
            <thead>
            <tr>
                <th>Sala</th>
                <th>Motivo</th>
                <th>Inicio</th>
                <th>Fin</th>
                <th>Asistentes</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="booking : ${bookings}">
                <td th:text="${booking.roomName}">Sala</td>
                <td th:text="${booking.name}">Motivo</td>
                <td th:text="${#temporals.format(booking.startTime, 'dd/MM/yyyy HH:mm')}">Inicio</td>
                <td th:text="${#temporals.format(booking.endTime, 'dd/MM/yyyy HH:mm')}">Fin</td>
                <td th:text="${booking.attendeeCount}">1</td>
                <td>
                    <span class="status"
                          th:classappend="${booking.status.name() == 'ACTIVE'} ? 'active' : 'other'"
                          th:text="${booking.status}">Estado</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
