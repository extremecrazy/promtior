<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            color-scheme: light;
            --background: #f5f4f4;
            --card-bg: #ffffff;
            --text: #171717;
            --text-muted: #82797d;
            --border: #e5e3e2;
            --accent: #171717;
            --accent-hover: #2b2b2b;
            --ring: #c4b8e0;
            --error-bg: #fef2f2;
            --error-text: #b91c1c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Geist', "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
            background: var(--background);
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 32px;
            box-shadow: 0 12px 32px rgba(23, 23, 23, 0.08);
        }

        .card h1 {
            margin: 0 0 4px;
            font-family: 'Fraunces', Georgia, serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text);
            text-align: center;
        }

        .card p.subtitle {
            margin: 0 0 28px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .error {
            background: var(--error-bg);
            color: var(--error-text);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
        }

        .field input {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fafafa;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .field input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(196, 184, 224, 0.4);
            background: #fff;
        }

        button {
            width: 100%;
            padding: 12px 14px;
            margin-top: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.05s ease;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.99);
        }

        @media (max-width: 420px) {
            .card {
                padding: 32px 22px;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Bienvenido</h1>
    <p class="subtitle">Ingresá para gestionar tus reservas</p>
    <p class="error" th:if="${param.error}">Usuario o contraseña incorrectos.</p>
    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" autocomplete="username" required="required"/>
        </div>
        <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required="required"/>
        </div>
        <button type="submit">Ingresar</button>
    </form>
</div>
</body>
</html>
