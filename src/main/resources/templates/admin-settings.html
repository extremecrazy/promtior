<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Configuración de reservas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            color-scheme: light;
            --background: #f5f4f4;
            --sidebar-bg: #171717;
            --sidebar-text: #b8b6b3;
            --sidebar-active: #ffffff;
            --sidebar-accent: #c4b8e0;
            --card-bg: #ffffff;
            --text: #171717;
            --text-muted: #82797d;
            --border: #e5e3e2;
            --accent: #171717;
            --accent-hover: #2b2b2b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            font-family: 'Geist', "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
            background: var(--background);
        }

        .sidebar {
            width: 220px;
            flex-shrink: 0;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .sidebar-brand {
            padding: 0 20px 20px;
            display: flex;
            align-items: center;
        }

        .sidebar-logo {
            width: 120px;
            height: auto;
            display: block;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            color: var(--sidebar-text);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            border-left: 3px solid transparent;
        }

        .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .sidebar-nav a.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--sidebar-active);
            border-left-color: var(--sidebar-accent);
        }

        .sidebar-nav .icon {
            font-size: 1.05rem;
        }

        .sidebar-footer {
            padding: 16px 20px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-footer .username {
            font-weight: 600;
            color: #fff;
            font-size: 0.9rem;
        }

        .sidebar-footer form {
            margin: 0;
        }

        .sidebar-footer button {
            width: 100%;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            background: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .sidebar-footer button:hover {
            background: var(--background);
        }

        main {
            flex: 1;
            min-width: 0;
            padding: 32px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .settings-card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(23, 23, 23, 0.08);
            padding: 32px;
        }

        .settings-card h1 {
            margin: 0 0 8px;
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 600;
            color: var(--text);
            font-size: 1.4rem;
        }

        .settings-card p.subtitle {
            margin: 0 0 24px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
        }

        .field {
            margin-bottom: 18px;
        }

        .field .hint {
            margin-top: 4px;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
        }

        button.submit {
            width: 100%;
            padding: 12px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        button.submit:hover {
            background: var(--accent-hover);
        }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 18px;
        }

        .alert.success {
            background: #ecfdf5;
            color: #047857;
        }

        .alert.error {
            background: #fef2f2;
            color: #b91c1c;
        }

        @media (max-width: 720px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                flex-direction: row;
                align-items: center;
                flex-wrap: wrap;
                gap: 8px 16px;
                padding: 12px 16px;
            }

            .sidebar-brand {
                padding: 0;
                margin-right: 4px;
            }

            .sidebar-logo {
                width: 90px;
            }

            .sidebar-nav {
                flex: 1 1 auto;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 4px;
            }

            .sidebar-nav a {
                padding: 6px 10px;
                border-left: none;
                border-bottom: 3px solid transparent;
            }

            .sidebar-nav a.active {
                border-left-color: transparent;
                border-bottom-color: var(--sidebar-accent);
            }

            .sidebar-footer {
                flex-direction: row;
                align-items: center;
                border-top: none;
                padding: 0;
                gap: 10px;
            }

            .sidebar-footer button {
                width: auto;
            }

            main {
                padding: 16px;
            }

            .settings-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar(active='admin', username=${username}, isAdmin=${isAdmin})}"></div>
<main>
    <div class="settings-card">
        <h1>Configuración de reservas</h1>
        <p class="subtitle">Duración de cada slot y cantidad máxima de slots por reserva.</p>

        <p class="alert success" th:if="${success}">Configuración actualizada.</p>
        <p class="alert error" th:if="${error}" th:text="${error}">Error</p>

        <form th:action="@{/admin/settings}" method="post">
            <div class="field">
                <label for="slotMinutes">Minutos por slot</label>
                <input type="number" id="slotMinutes" name="slotMinutes" min="1" th:value="${settings.slotMinutes}" required/>
                <p class="hint">Tiene que ser múltiplo o divisor de 60 (ej: 15, 20, 30, 60, 120).</p>
            </div>
            <div class="field">
                <label for="maxSlots">Máximo de slots por reserva</label>
                <input type="number" id="maxSlots" name="maxSlots" min="1" th:value="${settings.maxSlots}" required/>
                <p class="hint">Duración máxima resultante: <span th:text="${settings.slotMinutes * settings.maxSlots}">180</span> minutos.</p>
            </div>
            <button class="submit" type="submit">Guardar</button>
        </form>
    </div>
</main>
</body>
</html>
